    <script>
      // Safeguard against iframe/sandbox environments where window.fetch has only a getter
      (function() {
        try {
          let target = window;
          let desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          if (!desc) {
            target = Object.getPrototypeOf(window);
            desc = target ? Object.getOwnPropertyDescriptor(target, 'fetch') : null;
          }
          if (desc && !desc.set && desc.configurable !== false) {
            const origGet = desc.get;
            let currentFetch = origGet ? origGet.call(window) : window.fetch;
            Object.defineProperty(window, 'fetch', {
              get() {
                return currentFetch || (origGet ? origGet.call(this) : undefined);
              },
              set(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('Cannot set property fetch of')) {
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
