version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: localcloud-postgres
    restart: always
    environment:
      POSTGRES_USER: localcloud
      POSTGRES_PASSWORD: localcloud_password
      POSTGRES_DB: localcloud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localcloud -d localcloud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
